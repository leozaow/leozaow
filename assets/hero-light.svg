<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Leandro Barbosa</title>
  <desc id="desc">GitHub profile banner.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.58" stop-color="#f6f8fa"/>
      <stop offset="1" stop-color="#eef2f6"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0969da"/>
      <stop offset="0.5" stop-color="#8250df"/>
      <stop offset="1" stop-color="#1a7f37"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#d0d7de" stroke-width="1" opacity=".42"/>
    </pattern>
    <style>
      .name{font:700 48px 'Segoe UI',Ubuntu,sans-serif;letter-spacing:1.2px;fill:#1f2328}
      .sub{font:600 18px 'Segoe UI',Ubuntu,sans-serif;fill:#57606a;letter-spacing:2.5px}
      .small{font:600 14px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#57606a;letter-spacing:.9px}
      .agent{font:700 14px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#1f2328;letter-spacing:.8px}
      .dot{animation:blink 1.7s ease-in-out infinite}
      @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="298" rx="24" fill="url(#bg)" stroke="#d0d7de"/>
  <rect x="1" y="1" width="1198" height="298" rx="24" fill="url(#grid)"/>

  <circle cx="1080" cy="60" r="115" fill="#0969da" opacity=".035"/>
  <circle cx="1030" cy="240" r="140" fill="#8250df" opacity=".03"/>
  <circle cx="180" cy="260" r="120" fill="#1a7f37" opacity=".025"/>

  <text x="70" y="90" class="name">LEANDRO BARBOSA</text>
  <text x="72" y="128" class="sub">DIREITO · GESTÃO PÚBLICA · AGENTES DE IA</text>

  <line x1="70" y1="168" x2="1130" y2="168" stroke="#d0d7de" stroke-width="1"/>
  <line x1="70" y1="168" x2="1130" y2="168" stroke="url(#accent)" stroke-width="1" opacity=".5" stroke-dasharray="9 12">
    <animate attributeName="stroke-dashoffset" from="0" to="-84" dur="4s" repeatCount="indefinite"/>
  </line>

  <rect x="70" y="222" width="1060" height="48" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="92" y="252" class="small">ENGINE</text>
  <rect x="168" y="240" width="10" height="10" rx="5" fill="#1a7f37" class="dot"/>
  <text x="192" y="252" class="agent">OPENAI CODEX × GOOGLE ANTIGRAVITY</text>
</svg>
