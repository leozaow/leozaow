<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="370" viewBox="0 0 1200 370" role="img" aria-labelledby="title desc" lang="pt-BR">
  <title id="title">Leandro Barbosa — Tecnologia e Inovação na Administração Pública</title>
  <desc id="desc">Automação, Dados e Inteligência Artificial. Fluxos se organizam em módulos conectados, representando a transformação de processos administrativos em soluções digitais.</desc>
  <defs>
    <style>
      text { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
      .name { font-size: 25px; font-weight: 600; letter-spacing: 3px; fill: #20343C; }
      .headline { font-size: 40px; font-weight: 600; letter-spacing: -.6px; fill: #20343C; }
      .pillars { font-size: 22px; font-weight: 500; letter-spacing: 1.3px; fill: #226B66; }
      @media (max-width: 600px) {
        .diagram { display: none; }
        .name { font-size: 36px; letter-spacing: 2px; }
        .headline { font-size: 54px; letter-spacing: -1px; }
        .pillars { font-size: 29px; letter-spacing: .5px; }
      }
    </style>
  </defs>

  <!-- Plano editorial: margem de 64, módulo de 8, sem recursos externos. -->
  <rect x=".5" y=".5" width="1199" height="369" rx="12" fill="#F6F7F5" stroke="#CAD5D2"/>
  <path d="M64 44H104" stroke="#226B66" stroke-width="4"/>
  <text x="64" y="88" class="name">LEANDRO BARBOSA</text>
  <text class="headline">
    <tspan x="64" y="164">TECNOLOGIA E INOVAÇÃO</tspan>
    <tspan x="64" y="220">NA ADMINISTRAÇÃO PÚBLICA</tspan>
  </text>

