<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     style="isolation: isolate;" viewBox="0 0 495 195" width="495px" height="195px" direction="ltr" role="img" aria-label="Estatísticas e Sequência GitHub de leozaow">
  <defs>
    <style>
      @keyframes currstreak {
        0% { font-size: 3px; opacity: 0.2; }
        80% { font-size: 34px; opacity: 1; }
        100% { font-size: 28px; opacity: 1; }
      }
      @keyframes fadein {
        0% { opacity: 0; }
        100% { opacity: 1; }
      }
      @keyframes flamePulse {
        0%, 100% {
          transform: scale(1);
          filter: drop-shadow(0 0 2px rgba(251, 140, 0, 0.45));
        }
        50% {
          transform: scale(1.08);
          filter: drop-shadow(0 0 7px rgba(251, 140, 0, 0.9));
        }
      }
    </style>
    <clipPath id="outer_rectangle">
      <rect width="495" height="195" rx="8"/>
    </clipPath>
    <mask id="mask_out_ring_behind_fire">
      <rect width="495" height="195" fill="white"/>
      <ellipse id="mask-ellipse" cx="247.5" cy="32" rx="14" ry="18" fill="black"/>
    </mask>
  </defs>

  <g clip-path="url(#outer_rectangle)">
    <!-- Background Card -->
    <rect stroke="#d0d7de" fill="#ffffff" rx="8" x="0.5" y="0.5" width="494" height="194"/>

    <!-- Clean Vertical Dividers -->
    <line x1="165" y1="28" x2="165" y2="170" stroke="#d0d7de" stroke-width="1"/>
    <line x1="330" y1="28" x2="330" y2="170" stroke="#d0d7de" stroke-width="1"/>

    <!-- Column 1: Total Contributions -->
    <g style="isolation: isolate;">
      <g transform="translate(82.5, 48)">
        <text x="0" y="32" text-anchor="middle" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="28px" style="opacity: 0; animation: fadein 0.5s linear forwards 0.5s;">
          500
        </text>
      </g>
      <g transform="translate(82.5, 84)">
        <text x="0" y="32" text-anchor="middle" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="600" font-size="14px" style="opacity: 0; animation: fadein 0.5s linear forwards 0.6s;">
          Total de Contribuições
        </text>
      </g>
      <g transform="translate(82.5, 114)">
        <text x="0" y="32" text-anchor="middle" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400" font-size="12px" style="opacity: 0; animation: fadein 0.5s linear forwards 0.7s;">
          Jan. 2015 – Presente
        </text>
      </g>
    </g>

    <!-- Column 2: Current Streak (Centerpiece) -->
    <g style="isolation: isolate;">
      <!-- Streak Ring with Masked Gap -->
      <g mask="url(#mask_out_ring_behind_fire)">
        <circle cx="247.5" cy="71" r="40" fill="none" stroke="#fb8c00" stroke-width="5" style="opacity: 0; animation: fadein 0.5s linear forwards 0.3s;"/>
      </g>

      <!-- Animated Fire Icon with Pulsing Flame Effect -->
      <g transform="translate(247.5, 19.5)" style="transform-origin: 247.5px 33px; animation: flamePulse 2.2s ease-in-out infinite, fadein 0.5s linear forwards 0.5s;">
        <path d="M -12 -0.5 L 15 -0.5 L 15 23.5 L -12 23.5 L -12 -0.5 Z" fill="none"/>
        <path d="M 1.5 0.67 C 1.5 0.67 2.24 3.32 2.24 5.47 C 2.24 7.53 0.89 9.2 -1.17 9.2 C -3.23 9.2 -4.79 7.53 -4.79 5.47 L -4.76 5.11 C -6.78 7.51 -8 10.62 -8 13.99 C -8 18.41 -4.42 22 0 22 C 4.42 22 8 18.41 8 13.99 C 8 8.6 5.41 3.79 1.5 0.67 Z M -0.29 19 C -2.07 19 -3.51 17.6 -3.51 15.86 C -3.51 14.24 -2.46 13.1 -0.7 12.74 C 1.07 12.38 2.9 11.53 3.92 10.16 C 4.31 11.45 4.51 12.81 4.51 14.2 C 4.51 16.85 2.36 19 -0.29 19 Z" fill="#fb8c00"/>
      </g>

      <!-- Current Streak Big Number -->
      <g transform="translate(247.5, 48)">
        <text x="0" y="32" text-anchor="middle" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="28px" style="animation: currstreak 0.6s linear forwards;">
          4
        </text>
      </g>

      <!-- Current Streak Label -->
      <g transform="translate(247.5, 108)">
        <text x="0" y="32" text-anchor="middle" fill="#fb8c00" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="14px" style="opacity: 0; animation: fadein 0.5s linear forwards 0.8s;">
          Sequência Atual
        </text>
      </g>

      <!-- Current Streak Range & Weeks -->
      <g transform="translate(247.5, 145)">
        <text x="0" y="21" text-anchor="middle" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400" font-size="12px" style="opacity: 0; animation: fadein 0.5s linear forwards 0.9s;">
          3 semanas consecutivas
        </text>
      </g>
    </g>

    <!-- Column 3: Longest Streak -->
    <g style="isolation: isolate;">
      <g transform="translate(412.5, 48)">
        <text x="0" y="32" text-anchor="middle" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="28px" style="opacity: 0; animation: fadein 0.5s linear forwards 0.7s;">
          9
        </text>
      </g>
      <g transform="translate(412.5, 84)">
        <text x="0" y="32" text-anchor="middle" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="600" font-size="14px" style="opacity: 0; animation: fadein 0.5s linear forwards 0.8s;">
          Maior Sequência
        </text>
      </g>
      <g transform="translate(412.5, 114)">
        <text x="0" y="32" text-anchor="middle" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400" font-size="12px" style="opacity: 0; animation: fadein 0.5s linear forwards 0.9s;">
          Recorde: 20 semanas
        </text>
      </g>
    </g>
  </g>
</svg>