<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Leandro Barbosa — From rules to systems</title>
  <desc id="desc">Animated GitHub profile banner connecting legal context, public process, AI agents and working systems.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.58" stop-color="#101827"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="0.5" stop-color="#a371f7"/>
      <stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#30363d" stroke-width="1" opacity="0.34"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .name{font:700 48px 'Segoe UI',Ubuntu,sans-serif;letter-spacing:1.2px;fill:#f0f6fc}
      .tag{font:600 21px 'Segoe UI',Ubuntu,sans-serif;fill:#8c959f;letter-spacing:3px}
      .node{font:700 14px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#c9d1d9;letter-spacing:.8px}
      .small{font:600 14px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#8c959f;letter-spacing:.9px}
      .agent{font:700 14px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#f0f6fc;letter-spacing:.8px}
      .pulse{animation:pulse 2.3s ease-in-out infinite;transform-origin:center}
      @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="358" rx="24" fill="url(#bg)" stroke="#30363d"/>
  <rect x="1" y="1" width="1198" height="358" rx="24" fill="url(#grid)"/>

  <circle cx="1080" cy="70" r="115" fill="#58a6ff" opacity=".045"/>
  <circle cx="1030" cy="280" r="140" fill="#a371f7" opacity=".04"/>
  <circle cx="180" cy="310" r="120" fill="#3fb950" opacity=".035"/>

  <text x="70" y="88" class="name">LEANDRO BARBOSA</text>
  <text x="72" y="128" class="tag">FROM RULES → SYSTEMS</text>

  <line x1="112" y1="219" x2="1085" y2="219" stroke="#30363d" stroke-width="2"/>
  <line x1="112" y1="219" x2="1085" y2="219" stroke="url(#accent)" stroke-width="2" opacity=".55" stroke-dasharray="9 12">
    <animate attributeName="stroke-dashoffset" from="0" to="-84" dur="4s" repeatCount="indefinite"/>
  </line>

  <g>
    <circle cx="150" cy="219" r="8" fill="#58a6ff"/>
    <circle cx="150" cy="219" r="17" fill="none" stroke="#58a6ff" opacity=".26" class="pulse"/>
    <text x="112" y="188" class="node">LEGAL CONTEXT</text>
  </g>

  <g>
    <circle cx="430" cy="219" r="8" fill="#79c0ff"/>
    <circle cx="430" cy="219" r="17" fill="none" stroke="#79c0ff" opacity=".23" class="pulse" style="animation-delay:.35s"/>
    <text x="366" y="188" class="node">PUBLIC PROCESS</text>
  </g>

  <g>
    <circle cx="720" cy="219" r="8" fill="#a371f7"/>
    <circle cx="720" cy="219" r="17" fill="none" stroke="#a371f7" opacity=".26" class="pulse" style="animation-delay:.7s"/>
    <text x="674" y="188" class="node">AI AGENTS</text>
  </g>

  <g>
    <circle cx="1010" cy="219" r="8" fill="#3fb950"/>
    <circle cx="1010" cy="219" r="17" fill="none" stroke="#3fb950" opacity=".26" class="pulse" style="animation-delay:1.05s"/>
    <text x="946" y="188" class="node">WORKING SYSTEM</text>
  </g>

  <circle r="5" fill="#ffffff" filter="url(#glow)">
    <animateMotion dur="5.5s" repeatCount="indefinite" path="M150,219 C265,219 315,219 430,219 S605,219 720,219 S895,219 1010,219"/>
  </circle>

  <rect x="70" y="277" width="1060" height="48" rx="12" fill="#161b22" stroke="#30363d"/>
  <text x="92" y="307" class="small">CURRENT MODE</text>
  <rect x="236" y="291" width="10" height="10" rx="5" fill="#3fb950">
    <animate attributeName="opacity" values="1;.25;1" dur="1.7s" repeatCount="indefinite"/>
  </rect>
  <text x="260" y="307" class="agent">VIBE CODING  //  OPENAI CODEX × GOOGLE ANTIGRAVITY</text>
</svg>
