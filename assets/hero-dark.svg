<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="370" viewBox="0 0 1200 370" role="img" aria-labelledby="title desc" lang="pt-BR">
  <title id="title">Leandro Barbosa — Tecnologia e Inovação na Administração Pública</title>
  <desc id="desc">Um fluxo sináptico animado transforma contexto público e dados em automação, inteligência artificial e soluções digitais.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset=".58" stop-color="#101827"/><stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/><stop offset=".34" stop-color="#79c0ff"/><stop offset=".67" stop-color="#a371f7"/><stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
    <linearGradient id="flow1" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#58a6ff"/><stop offset="1" stop-color="#79c0ff"/></linearGradient>
    <linearGradient id="flow2" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#79c0ff"/><stop offset="1" stop-color="#a371f7"/></linearGradient>
    <linearGradient id="flow3" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#a371f7"/><stop offset="1" stop-color="#3fb950"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#26303b" stroke-width="1" opacity=".42"/>
    </pattern>
    <radialGradient id="fade" cx="50%" cy="57%" r="68%"><stop offset=".42" stop-color="white"/><stop offset="1" stop-color="black"/></radialGradient>
    <mask id="gridFade"><rect width="1200" height="370" fill="url(#fade)"/></mask>
    <filter id="signalGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      text { font-family: 'Segoe UI', Ubuntu, -apple-system, BlinkMacSystemFont, Arial, sans-serif; }
      .name { font-size: 34px; font-weight: 700; letter-spacing: 1.5px; fill: #f0f6fc; }
      .position { font-size: 19px; font-weight: 650; letter-spacing: 1.35px; fill: #f0f6fc; }
      .pillars { font-size: 14px; font-weight: 600; letter-spacing: 2.1px; fill: #8c959f; }
      .node-title { font-size: 13px; font-weight: 700; letter-spacing: 1px; fill: #f0f6fc; }
      .node-sub { font-size: 11px; font-weight: 500; fill: #8c959f; }
      .flow { stroke-dasharray: 12 16; }
      .status-label { font-size: 10px; font-weight: 700; letter-spacing: 1.4px; fill: #8c959f; }
      .status-text { font-size: 11px; font-weight: 650; letter-spacing: .8px; fill: #f0f6fc; }
    </style>
  </defs>

  <rect x=".5" y=".5" width="1199" height="369" rx="18" fill="url(#bg)" stroke="#30363d"/>
  <rect x="1" y="1" width="1198" height="368" rx="18" fill="url(#grid)" mask="url(#gridFade)"/>

  <!-- Subtle cartographic gestures: a quiet reference to place, never a landmark. -->
  <g fill="none" stroke="#30363d" stroke-width="1" opacity=".34">
    <path d="M1015 26c-30 24-26 49-57 67s-28 48-11 65"/>
    <path d="M1051 22c-31 32-18 54-57 78s-32 55-10 77"/>
    <path d="M1087 20c-26 35-14 61-53 88s-29 57-6 78"/>
  </g>

  <rect x="64" y="42" width="132" height="4" rx="2" fill="url(#brand)"/>
  <text x="64" y="82" class="name">LEANDRO BARBOSA</text>
  <text x="65" y="116" class="position">TECNOLOGIA E INOVAÇÃO NA ADMINISTRAÇÃO PÚBLICA</text>
  <text x="66" y="143" class="pillars">AUTOMAÇÃO · DADOS · INTELIGÊNCIA ARTIFICIAL</text>

  <!-- Synaptic public system: parallel routes converge on the same operational transformation. -->
  <g fill="none" stroke-linecap="round">
    <path d="M150 246C265 218 320 274 430 246" stroke="#30363d" stroke-width="5" opacity=".62"/>
    <path d="M430 246C548 215 602 277 720 246" stroke="#30363d" stroke-width="5" opacity=".62"/>
    <path d="M720 246C838 215 892 277 1010 246" stroke="#30363d" stroke-width="5" opacity=".62"/>
    <path d="M150 246C265 218 320 274 430 246" stroke="url(#flow1)" stroke-width="2.8" class="flow"><animate attributeName="stroke-dashoffset" from="0" to="-112" dur="4s" begin="-0s" repeatCount="indefinite"/></path>
    <path d="M430 246C548 215 602 277 720 246" stroke="url(#flow2)" stroke-width="2.8" class="flow"><animate attributeName="stroke-dashoffset" from="0" to="-112" dur="4s" begin="-1.3s" repeatCount="indefinite"/></path>
    <path d="M720 246C838 215 892 277 1010 246" stroke="url(#flow3)" stroke-width="2.8" class="flow"><animate attributeName="stroke-dashoffset" from="0" to="-112" dur="4s" begin="-2.6s" repeatCount="indefinite"/></path>

    <path d="M150 246C244 196 335 195 430 246" stroke="url(#flow1)" stroke-width="1.4" stroke-dasharray="3 6" opacity=".48"/>
    <path d="M150 246C245 299 337 300 430 246" stroke="url(#flow1)" stroke-width="1.4" stroke-dasharray="3 7" opacity=".34"/>
    <path d="M430 246C528 195 621 195 720 246" stroke="url(#flow2)" stroke-width="1.4" stroke-dasharray="3 6" opacity=".48"/>
    <path d="M430 246C529 300 622 299 720 246" stroke="url(#flow2)" stroke-width="1.4" stroke-dasharray="3 7" opacity=".34"/>
    <path d="M720 246C817 195 912 195 1010 246" stroke="url(#flow3)" stroke-width="1.4" stroke-dasharray="3 6" opacity=".48"/>
    <path d="M720 246C818 300 913 299 1010 246" stroke="url(#flow3)" stroke-width="1.4" stroke-dasharray="3 7" opacity=".34"/>
  </g>

  <g stroke="#30363d" stroke-width="1.2" opacity=".76">
    <path d="M150 246L116 219M150 246l-32 31"/><circle cx="116" cy="219" r="3" fill="#58a6ff"/><circle cx="118" cy="277" r="3" fill="#58a6ff"/>
    <path d="M430 246v-43m0 43l29 34"/><circle cx="430" cy="203" r="3" fill="#79c0ff"/><circle cx="459" cy="280" r="3" fill="#79c0ff"/>
    <path d="M720 246l-25-43m25 43l27 34"/><circle cx="695" cy="203" r="3" fill="#a371f7"/><circle cx="747" cy="280" r="3" fill="#a371f7"/>
    <path d="M1010 246l34-28m-34 28l33 31"/><circle cx="1044" cy="218" r="3" fill="#3fb950"/><circle cx="1043" cy="277" r="3" fill="#3fb950"/>
  </g>

  <!-- Nodes pulse in sequence as information reaches each stage. -->
  <g>
    <circle cx="150" cy="246" r="24" fill="#58a6ff" opacity=".12"><animate attributeName="r" values="24;31;24" dur="4.8s" begin="0s" repeatCount="indefinite"/><animate attributeName="opacity" values=".10;.28;.10" dur="4.8s" begin="0s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="246" r="15" fill="#161b22" stroke="#58a6ff" stroke-width="2.5"/>
    <circle cx="150" cy="246" r="6" fill="#58a6ff"/>
    <circle cx="150" cy="246" r="20" class="pulse" fill="none" stroke="#58a6ff" opacity="0"><animate attributeName="r" values="18;32;18;18" keyTimes="0;.09;.18;1" dur="6.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.7;0;0" keyTimes="0;.09;.18;1" dur="6.4s" repeatCount="indefinite"/></circle>
    <text x="150" y="183" text-anchor="middle" class="node-title">CONTEXTO PÚBLICO</text><text x="150" y="200" text-anchor="middle" class="node-sub">regras e processos reais</text>
  </g>
  <g>
    <circle cx="430" cy="246" r="24" fill="#79c0ff" opacity=".12"><animate attributeName="r" values="24;31;24" dur="4.8s" begin="-1.2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".10;.28;.10" dur="4.8s" begin="-1.2s" repeatCount="indefinite"/></circle>
    <circle cx="430" cy="246" r="15" fill="#161b22" stroke="#79c0ff" stroke-width="2.5"/>
    <circle cx="430" cy="246" r="6" fill="#79c0ff"/>
    <circle cx="430" cy="246" r="20" class="pulse" fill="none" stroke="#79c0ff" opacity="0"><animate attributeName="r" values="18;32;18;18" keyTimes="0;.09;.18;1" dur="6.4s" begin="2.13s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.7;0;0" keyTimes="0;.09;.18;1" dur="6.4s" begin="2.13s" repeatCount="indefinite"/></circle>
    <text x="430" y="183" text-anchor="middle" class="node-title">DADOS</text><text x="430" y="200" text-anchor="middle" class="node-sub">informação estruturada</text>
  </g>
  <g>
    <circle cx="720" cy="246" r="24" fill="#a371f7" opacity=".12"><animate attributeName="r" values="24;31;24" dur="4.8s" begin="-2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".10;.28;.10" dur="4.8s" begin="-2.4s" repeatCount="indefinite"/></circle>
    <circle cx="720" cy="246" r="15" fill="#161b22" stroke="#a371f7" stroke-width="2.5"/>
    <circle cx="720" cy="246" r="6" fill="#a371f7"/>
    <circle cx="720" cy="246" r="20" class="pulse" fill="none" stroke="#a371f7" opacity="0"><animate attributeName="r" values="18;32;18;18" keyTimes="0;.09;.18;1" dur="6.4s" begin="4.27s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.7;0;0" keyTimes="0;.09;.18;1" dur="6.4s" begin="4.27s" repeatCount="indefinite"/></circle>
    <text x="720" y="183" text-anchor="middle" class="node-title">AUTOMAÇÃO + IA</text><text x="720" y="200" text-anchor="middle" class="node-sub">capacidade aplicada</text>
  </g>
  <g>
    <circle cx="1010" cy="246" r="24" fill="#3fb950" opacity=".12"><animate attributeName="r" values="24;31;24" dur="4.8s" begin="-3.6s" repeatCount="indefinite"/><animate attributeName="opacity" values=".10;.28;.10" dur="4.8s" begin="-3.6s" repeatCount="indefinite"/></circle>
    <circle cx="1010" cy="246" r="15" fill="#161b22" stroke="#3fb950" stroke-width="2.5"/>
    <circle cx="1010" cy="246" r="6" fill="#3fb950"/>
    <circle cx="1010" cy="246" r="20" class="pulse" fill="none" stroke="#3fb950" opacity="0"><animate attributeName="r" values="18;32;18;18" keyTimes="0;.09;.18;1" dur="6.4s" begin="-.05s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.7;0;0" keyTimes="0;.09;.18;1" dur="6.4s" begin="-.05s" repeatCount="indefinite"/></circle>
    <text x="1010" y="183" text-anchor="middle" class="node-title">SOLUÇÕES DIGITAIS</text><text x="1010" y="200" text-anchor="middle" class="node-sub">trabalho transformado</text>
  </g>

  <!-- One continuous signal makes the transformation legible; a second packet suggests a living system. -->
  <circle r="8" class="signal" fill="#58a6ff" opacity=".34" filter="url(#signalGlow)"><animate attributeName="fill" values="#58a6ff;#79c0ff;#a371f7;#3fb950" keyTimes="0;.33;.66;1" dur="6.4s" repeatCount="indefinite"/><animateMotion dur="6.4s" repeatCount="indefinite" path="M150 246C265 218 320 274 430 246C548 215 602 277 720 246C838 215 892 277 1010 246"/></circle>
  <circle r="4" class="signal" fill="#ffffff"><animateMotion dur="6.4s" repeatCount="indefinite" path="M150 246C265 218 320 274 430 246C548 215 602 277 720 246C838 215 892 277 1010 246"/></circle>
  <circle r="3.5" class="signal" fill="#a371f7" opacity=".9"><animateMotion dur="6.4s" begin="-3.2s" repeatCount="indefinite" path="M150 246C265 196 335 195 430 246C528 195 621 195 720 246C817 195 912 195 1010 246"/></circle>

  <!-- Persistent system status: the pulse confirms that the public-to-digital flow is alive. -->
  <rect x="64" y="318" width="1072" height="36" rx="9" fill="#161b22" stroke="#30363d"/>
  <text x="84" y="341" class="status-label">FLUXO ATIVO</text>
  <circle cx="190" cy="337" r="4" fill="#3fb950"><animate attributeName="opacity" values="1;.25;1" dur="1.6s" repeatCount="indefinite"/></circle>
  <circle cx="190" cy="337" r="5" fill="none" stroke="#3fb950" opacity=".5"><animate attributeName="r" values="5;10;5" dur="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values=".55;0;.55" dur="1.6s" repeatCount="indefinite"/></circle>
  <text x="212" y="341" class="status-text">PROCESSOS REAIS  →  DADOS  →  AUTOMAÇÃO + IA  →  SOLUÇÕES DIGITAIS</text>
</svg>
