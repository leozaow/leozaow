<svg xmlns="http://www.w3.org/2000/svg" width="850" height="205" viewBox="0 0 850 205" role="img" aria-label="Estatísticas e Sequência GitHub de leozaow">
  <defs>
    <linearGradient id="headerLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fb8500"/>
      <stop offset="30%" stop-color="#ffb703"/>
      <stop offset="70%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
    <filter id="ringGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .badge-title { font: 700 12px ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: 1.5px; fill: #8c959f; }
      .stat-num { font: 800 32px 'Segoe UI', Ubuntu, -apple-system, sans-serif; fill: #f0f6fc; }
      .stat-num-orange { font: 800 34px 'Segoe UI', Ubuntu, -apple-system, sans-serif; fill: #fb8500; }
      .stat-label { font: 700 11px ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: 0.8px; fill: #8c959f; }
      .stat-sub { font: 500 10px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #8c959f; }
      .flame { animation: pulseFlame 1.8s ease-in-out infinite; transform-origin: 295px 105px; }
      @keyframes pulseFlame { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
    </style>
  </defs>

  <!-- Card Background -->
  <rect x="1" y="1" width="848" height="203" rx="16" fill="#0d1117" stroke="#30363d"/>
  <rect x="1" y="1" width="848" height="4" rx="2" fill="url(#headerLine)"/>

  <!-- Card Title -->
  <text x="28" y="32" class="badge-title">GITHUB STATS &amp; STREAK</text>
  <text x="822" y="32" text-anchor="end" class="stat-sub">TZ: America/Sao_Paulo</text>

  <!-- Column 1: Total Contributions -->
  <g transform="translate(28, 48)">
    <rect width="180" height="135" rx="12" fill="#161b22" stroke="#30363d" stroke-width="0.8"/>
    <!-- Icon: Chart icon -->
    <path d="M 20 38 L 20 22 M 28 38 L 28 14 M 36 38 L 36 30" stroke="#58a6ff" stroke-width="2.5" stroke-linecap="round"/>
    <text x="50" y="32" class="stat-label">TOTAL</text>
    <text x="20" y="80" class="stat-num">496</text>
    <text x="20" y="104" class="stat-sub">CONTRIBUIÇÕES</text>
    <text x="20" y="122" class="stat-sub" fill="#3fb950">126 dias com atividade</text>
  </g>

  <!-- Column 2: Current Streak (Highlighted Circle Centerpiece) -->
  <g transform="translate(222, 48)">
    <rect width="270" height="135" rx="12" fill="#161b22" stroke="#fb8500" stroke-width="1.2" opacity="0.95"/>
    
    <!-- Circular Flame Badge (Inspired by ulsklyc & Cjaker) -->
    <circle cx="72" cy="67" r="42" fill="none" stroke="#30363d" stroke-width="4"/>
    <circle cx="72" cy="67" r="42" fill="none" stroke="#fb8500" stroke-width="4" stroke-dasharray="264" stroke-dashoffset="66" stroke-linecap="round" filter="url(#ringGlow)"/>
    
    <!-- SVG Flame Icon -->
    <path class="flame" d="M 72 38 C 72 38 78 48 78 54 C 78 58 75 61 72 61 C 69 61 66 58 66 54 C 66 48 72 38 72 38 Z" fill="#fb8500"/>
    
    <!-- Number inside ring -->
    <text x="72" y="80" text-anchor="middle" class="stat-num-orange">3</text>
    <text x="72" y="96" text-anchor="middle" class="stat-sub">DIAS</text>

    <!-- Info beside ring -->
    <text x="135" y="42" class="stat-label" fill="#fb8500">SEQUÊNCIA ATUAL</text>
    <text x="135" y="70" class="stat-num" style="font-size: 24px;">2 <tspan font-size="13" font-weight="500" fill="#8c959f">semanas</tspan></text>
    <text x="135" y="90" class="stat-sub">consecutivas ativas</text>
    <text x="135" y="118" class="stat-sub">Recorde diário: <tspan font-weight="700" fill="#f0f6fc">9 dias</tspan></text>
  </g>

  <!-- Column 3: Recent Activity (Last 35 Days Chart + Record Info) -->
  <g transform="translate(506, 48)">
    <rect width="316" height="135" rx="12" fill="#161b22" stroke="#30363d" stroke-width="0.8"/>
    <text x="20" y="28" class="stat-label">ÚLTIMOS 35 DIAS</text>
    <text x="296" y="28" text-anchor="end" class="stat-sub">Recorde: 20 sem.</text>
  </g>

