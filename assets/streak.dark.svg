<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     style="isolation: isolate;" viewBox="0 0 850 195" width="850px" height="195px" direction="ltr" role="img" aria-label="Estatísticas e Sequência GitHub de leozaow">
  <defs>
    <style>
      @keyframes currstreak {
        0% { font-size: 4px; opacity: 0.2; }
        80% { font-size: 34px; opacity: 1; }
        100% { font-size: 28px; opacity: 1; }
      }
      @keyframes fadein {
        0% { opacity: 0; }
        100% { opacity: 1; }
      }
      @keyframes flamePulse {
        0%, 100% {
          transform: scale(1);
          filter: drop-shadow(0 0 2px rgba(251, 140, 0, 0.5));
        }
        50% {
          transform: scale(1.1);
          filter: drop-shadow(0 0 8px rgba(251, 140, 0, 0.95));
        }
      }
      .flame-elem {
        transform-box: fill-box;
        transform-origin: center;
        animation: flamePulse 2.2s ease-in-out infinite;
      }
    </style>
    <clipPath id="outer_rectangle">
      <rect width="850" height="195" rx="10"/>
    </clipPath>
    <mask id="mask_ring_flame">
      <rect width="850" height="195" fill="white"/>
      <ellipse cx="312" cy="33" rx="14" ry="16" fill="black"/>
    </mask>
    <filter id="flameGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g clip-path="url(#outer_rectangle)">
    <!-- Main Background Card -->
    <rect stroke="#30363d" fill="#0d1117" rx="10" x="0.5" y="0.5" width="849" height="194"/>

    <!-- 3 Subtle Vertical Dividers -->
    <line x1="195" y1="26" x2="195" y2="168" stroke="#30363d" stroke-width="1"/>
    <line x1="430" y1="26" x2="430" y2="168" stroke="#30363d" stroke-width="1"/>
    <line x1="605" y1="26" x2="605" y2="168" stroke="#30363d" stroke-width="1"/>

    <!-- ZONE 1: Total Contributions -->
    <g style="isolation: isolate;">
      <g transform="translate(97, 48)">
        <text x="0" y="32" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="28px" style="opacity: 0; animation: fadein 0.5s linear forwards 0.4s;">
          549
        </text>
      </g>
      <g transform="translate(97, 84)">
        <text x="0" y="32" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="600" font-size="13px" style="opacity: 0; animation: fadein 0.5s linear forwards 0.5s;">
          Total de Contribuições
        </text>
      </g>
      <g transform="translate(97, 114)">
        <text x="0" y="32" text-anchor="middle" fill="#8c959f" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400" font-size="12px" style="opacity: 0; animation: fadein 0.5s linear forwards 0.6s;">
          Jan. 2015 – Presente
        </text>
      </g>
      <g transform="translate(97, 134)">
        <text x="0" y="32" text-anchor="middle" fill="#8c959f" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400" font-size="11px" style="opacity: 0; animation: fadein 0.5s linear forwards 0.7s;">
          135 dias com atividade
        </text>
      </g>
    </g>

    <!-- ZONE 2: Current Streak (Centerpiece with Ring & Glowing Flame) -->
    <g style="isolation: isolate;">
      <!-- Ring with gap for flame -->
      <g mask="url(#mask_ring_flame)">
        <circle cx="312" cy="72" r="40" fill="none" stroke="#fb8c00" stroke-width="5" style="opacity: 0; animation: fadein 0.5s linear forwards 0.3s;"/>
      </g>

      <!-- Authentic Flame Icon: perfectly seated at the crown of the ring -->
      <g transform="translate(312, 20.5)" filter="url(#flameGlow)">
        <path class="flame-elem" d="M 1.5 0.67 C 1.5 0.67 2.24 3.32 2.24 5.47 C 2.24 7.53 0.89 9.2 -1.17 9.2 C -3.23 9.2 -4.79 7.53 -4.79 5.47 L -4.76 5.11 C -6.78 7.51 -8 10.62 -8 13.99 C -8 18.41 -4.42 22 0 22 C 4.42 22 8 18.41 8 13.99 C 8 8.6 5.41 3.79 1.5 0.67 Z M -0.29 19 C -2.07 19 -3.51 17.6 -3.51 15.86 C -3.51 14.24 -2.46 13.1 -0.7 12.74 C 1.07 12.38 2.9 11.53 3.92 10.16 C 4.31 11.45 4.51 12.81 4.51 14.2 C 4.51 16.85 2.36 19 -0.29 19 Z" fill="#fb8c00"/>
      </g>

      <!-- Big Number Inside Ring -->
      <g transform="translate(312, 49)">
        <text x="0" y="32" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="28px" style="animation: currstreak 0.6s linear forwards;">
          6
        </text>
      </g>

      <!-- Label under ring -->
      <g transform="translate(312, 108)">
        <text x="0" y="32" text-anchor="middle" fill="#fb8c00" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="14px" style="opacity: 0; animation: fadein 0.5s linear forwards 0.7s;">
          Sequência Atual
        </text>
      </g>

      <!-- Weekly streak detail -->
      <g transform="translate(312, 134)">
        <text x="0" y="32" text-anchor="middle" fill="#8c959f" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="500" font-size="12px" style="opacity: 0; animation: fadein 0.5s linear forwards 0.8s;">
          4 semanas consecutivas
        </text>
      </g>
    </g>

    <!-- ZONE 3: Longest Streak -->
    <g style="isolation: isolate;">
      <g transform="translate(517, 48)">
        <text x="0" y="32" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="28px" style="opacity: 0; animation: fadein 0.5s linear forwards 0.6s;">
          9
        </text>
      </g>
      <g transform="translate(517, 84)">
        <text x="0" y="32" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="600" font-size="13px" style="opacity: 0; animation: fadein 0.5s linear forwards 0.7s;">
          Maior Sequência
        </text>
      </g>
      <g transform="translate(517, 114)">
        <text x="0" y="32" text-anchor="middle" fill="#8c959f" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400" font-size="12px" style="opacity: 0; animation: fadein 0.5s linear forwards 0.8s;">
          Recorde: 20 semanas
        </text>
      </g>
      <g transform="translate(517, 134)">
        <text x="0" y="32" text-anchor="middle" fill="#8c959f" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400" font-size="11px" style="opacity: 0; animation: fadein 0.5s linear forwards 0.9s;">
          25 jul. – 2 ago.
        </text>
      </g>
    </g>

    <!-- ZONE 4: Recent 35 Days Activity Chart -->
    <g style="isolation: isolate;">
      <text x="625" y="44" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="600" font-size="12px" letter-spacing="0.5px">ÚLTIMOS 35 DIAS</text>
      <text x="830" y="44" text-anchor="end" fill="#8c959f" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400" font-size="11px">Atividade diária</text>

