<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 195" width="850" height="195" role="img" aria-label="GitHub Streak Analytics for leozaow">
  <title>GitHub Contribution Streak Analytics — leozaow</title>
  <desc>Current streak: 21 days (Sep 30 – Oct 20, 2026). Longest streak: 21 days (Sep 30 – Oct 20, 2026). Contributions in the last 365 days: 682 across 69 active days.</desc>

  <defs>
    <style>
      .txt-val { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; font-size: 28px; font-weight: 700; fill: #f0f6fc; }
      .txt-lbl { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #8c959f; letter-spacing: 0.5px; text-transform: uppercase; }
      .txt-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 400; fill: #6e7681; }
      .txt-accent { fill: #fb8c00; font-weight: 600; }
      .txt-chart { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 400; fill: #6e7681; }
      .flame-pulse {
        transform-box: fill-box;
        transform-origin: center;
        animation: flamePulse 2.4s ease-in-out infinite;
      }
      @keyframes flamePulse {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 2px rgba(251, 140, 0, 0.4)); }
        50% { transform: scale(1.08); filter: drop-shadow(0 0 6px rgba(251, 140, 0, 0.4)); }
      }
      @media (prefers-reduced-motion: reduce) {
        .flame-pulse { animation: none !important; }
      }
    </style>
    <filter id="flameGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <mask id="ringGap">
      <rect width="850" height="195" fill="white"/>
      <ellipse cx="308" cy="34" rx="13" ry="15" fill="black"/>
    </mask>
