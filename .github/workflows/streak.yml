name: Generate self-hosted streak card

on:
  schedule:
    - cron: "37 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/generate_streak.py'
      - '.github/workflows/streak.yml'

permissions:
  contents: write

concurrency:
  group: streak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  streak:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate streak SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          TZ: America/Sao_Paulo
        run: python scripts/generate_streak.py

      - name: Commit generated cards
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add assets/streak.light.svg assets/streak.dark.svg
          if git commit -m "chore: refresh streak card [skip ci]"; then
            for i in {1..5}; do
              git pull --rebase origin main && git push && break || sleep 3
            done
          fi
